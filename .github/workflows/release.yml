name: Release

# Version tagging on every merge to `main` (PLAN-CI-001 §3.4, tag job only):
# - `VERSION` file > latest tag → tag that version verbatim (manual minor/major
#   bump via PR to `main`; the merge itself triggers the release).
# - `VERSION` file <= latest tag → auto-bump the latest tag's patch version.
# The VERSION file on `main` is a floor, not a mirror of the latest tag: this
# workflow NEVER pushes commits to `main` (branch rulesets require PRs and the
# GITHUB_TOKEN cannot bypass them), so no [skip ci] dance is needed either.
# Docs-only and every other merge release a patch too — no path filters.
# No build/deploy artifacts here — the tag and its auto-generated notes are the whole output.
on:
  push:
    branches: [main]

# Least privilege: tagging + release notes only.
permissions:
  contents: write

# Serialize pushes to `main` so two merges can't tag concurrently. A cancelled
# release run would leave a half-finished release, so never cancel in progress.
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  tag:
    name: Tag & create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # full history + tags: the tag job reads the latest tag

      - name: Decide version
        id: ver
        run: |
          set -euo pipefail
          git fetch --tags --force
          FILE_VER="$(tr -d '[:space:]' < VERSION)"
          if ! [[ "$FILE_VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::VERSION file must contain a single X.Y.Z line, got: '$FILE_VER'"
            exit 1
          fi
          LATEST_TAG="$(git tag --sort=-v:refname | head -n1)"
          LATEST_VER="${LATEST_TAG#v}"
          # FILE_VER strictly greater than LATEST_VER → manual bump ahead of the
          # tags: release it verbatim. Otherwise (equal or behind) auto-bump the
          # latest tag's patch segment.
          if [ "$FILE_VER" != "$(printf '%s\n%s\n' "$FILE_VER" "$LATEST_VER" | sort -V | head -n1)" ] && [ "$FILE_VER" != "$LATEST_VER" ]; then
            NEW_VER="$FILE_VER"
            echo "Using manual version: $NEW_VER (latest tag: $LATEST_TAG)"
          else
            MAJOR="${LATEST_VER%%.*}"
            MINOR="${LATEST_VER#*.}"; MINOR="${MINOR%%.*}"
            PATCH="${LATEST_VER##*.}"
            NEW_VER="$MAJOR.$MINOR.$((PATCH + 1))"
            echo "Auto-bumped patch: $LATEST_VER -> $NEW_VER"
          fi
          {
            echo "version=$NEW_VER"
            echo "tag=v$NEW_VER"
          } >> "$GITHUB_OUTPUT"

      # No commit step: the workflow never pushes to `main`. The ruleset on the
      # branch requires pull requests and the GITHUB_TOKEN cannot bypass it
      # (github-actions[bot] is not a bypass-eligible installed app).

      - name: Guard against concurrent tag (race check)
        run: |
          set -euo pipefail
          git fetch --tags --force
          if git rev-parse "v${{ steps.ver.outputs.version }}" >/dev/null 2>&1; then
            echo "::error::Tag v${{ steps.ver.outputs.version }} already exists (race with a concurrent merge). Re-run this job after resolving."
            exit 1
          fi

      - name: Create and push tag
        run: |
          set -euo pipefail
          git tag -a "v${{ steps.ver.outputs.version }}" -m "Release v${{ steps.ver.outputs.version }}"
          git push origin "v${{ steps.ver.outputs.version }}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${{ steps.ver.outputs.tag }}" --verify-tag --generate-notes

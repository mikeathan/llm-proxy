name: Release

# Version tagging on every merge to `main` (PLAN-CI-001 §3.4, tag job only):
# - `VERSION` file ≠ latest tag → tag that version verbatim (manual patch/minor/major bump via PR).
# - `VERSION` file == latest tag → auto-bump the patch version and commit it back to `main`.
# Docs-only and every other merge release a patch too — no path filters.
# No build/deploy artifacts here — the tag and its auto-generated notes are the whole output.
# The auto-bump commit uses [skip ci] and the GITHUB_TOKEN, so it cannot loop.
on:
  push:
    branches: [main]

# Least privilege: tagging + release notes only.
permissions:
  contents: write

# Serialize pushes to `main` so two merges can't tag concurrently. A cancelled
# release run would leave a half-finished release, so never cancel in progress.
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  tag:
    name: Tag & create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # full history + tags: the tag job reads the latest tag

      - name: Decide version
        id: ver
        run: |
          set -euo pipefail
          git fetch --tags --force
          FILE_VER="$(tr -d '[:space:]' < VERSION)"
          if ! [[ "$FILE_VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::VERSION file must contain a single X.Y.Z line, got: '$FILE_VER'"
            exit 1
          fi
          LATEST_TAG="$(git tag --sort=-v:refname | head -n1)"
          if [ "v$FILE_VER" = "$LATEST_TAG" ]; then
            # File already matches the latest tag → auto-bump the patch segment.
            MAJOR="${FILE_VER%%.*}"
            MINOR="${FILE_VER#*.}"; MINOR="${MINOR%%.*}"
            PATCH="${FILE_VER##*.}"
            NEW_VER="$MAJOR.$MINOR.$((PATCH + 1))"
            echo "$NEW_VER" > VERSION
            echo "bumped=true" >> "$GITHUB_OUTPUT"
            echo "Auto-bumped patch: $FILE_VER -> $NEW_VER"
          else
            NEW_VER="$FILE_VER"
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            echo "Using manual version: $NEW_VER (latest tag: $LATEST_TAG)"
          fi
          {
            echo "version=$NEW_VER"
            echo "tag=v$NEW_VER"
          } >> "$GITHUB_OUTPUT"

      - name: Commit VERSION bump
        if: steps.ver.outputs.bumped == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION
          git commit -m "chore(release): v${{ steps.ver.outputs.version }} [skip ci]"
          git push origin HEAD:main

      - name: Guard against concurrent tag (race check)
        run: |
          set -euo pipefail
          git fetch --tags --force
          if git rev-parse "v${{ steps.ver.outputs.version }}" >/dev/null 2>&1; then
            echo "::error::Tag v${{ steps.ver.outputs.version }} already exists (race with a concurrent merge). Re-run this job after resolving."
            exit 1
          fi

      - name: Create and push tag
        run: |
          set -euo pipefail
          git tag -a "v${{ steps.ver.outputs.version }}" -m "Release v${{ steps.ver.outputs.version }}"
          git push origin "v${{ steps.ver.outputs.version }}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${{ steps.ver.outputs.tag }}" --verify-tag --generate-notes

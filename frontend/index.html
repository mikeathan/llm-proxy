<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Pre-paint theme (plan D19): must run before any stylesheet so the stored
         theme is on <html> for the first paint. Same-origin, so no CSP change. -->
    <script src="/theme-boot.js"></script>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preload" href="./src/assets/fonts/JetBrainsMono-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>%APP_TITLE%</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Ultra-modern deep blue background -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/> <!-- deep slate -->
      <stop offset="100%" stop-color="#172554"/> <!-- deep royal blue -->
    </linearGradient>

    <!-- Vibrant premium gradient for the floating top face -->
    <linearGradient id="top-face" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/> <!-- Cyan -->
      <stop offset="100%" stop-color="#818CF8"/> <!-- Indigo -->
    </linearGradient>

    <!-- Deep professional gradients for the base structure -->
    <linearGradient id="left-face" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>

    <linearGradient id="right-face" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#3730A3"/>
    </linearGradient>

    <filter id="levitation-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="24" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)" rx="120"/>

  <g transform="translate(0, 15)">
    <!-- Levitating Top Face (Antigravity concept) -->
    <path d="M256 80 L140 145 L256 210 L372 145 Z" fill="url(#top-face)" filter="url(#levitation-glow)"/>

    <!-- Left Base Face -->
    <path d="M140 185 L256 250 L256 380 L140 315 Z" fill="url(#left-face)"/>

    <!-- Right Base Face -->
    <path d="M256 250 L372 185 L372 315 L256 380 Z" fill="url(#right-face)"/>
  </g>
</svg>
